    margin-bottom: 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);

  .post-card:hover {
    transform: translateY(-3px);

  }
  .post-card .date {

    font-size: 0.85em;
    margin-bottom: 6px;
  }
  .post-card h2 {
    color: var(--primary);
    font-size: 1.3em;
    margin-bottom: 8px;
  }
  .post-card p {
    color: #4a5568;
    font-size: 0.95em;
  }

  footer {
    text-align: center;
    color: var(--muted);
    margin-top: 48px;
    font-size: 0.85em;
